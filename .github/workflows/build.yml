name: Tests et build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest beautifulsoup4
      - run: pytest -q
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: livraddict-plugin
          path: dist/*.zip
      - name: Release (sur tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
